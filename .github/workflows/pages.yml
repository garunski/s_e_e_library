name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s_e_e_library
    steps:
      - name: Checkout library
        uses: actions/checkout@v7
        with:
          path: s_e_e_library

      - name: Checkout S.E.E. (path dependencies)
        uses: actions/checkout@v7
        with:
          repository: workwithsee/app
          ref: main
          path: s_e_e
          ssh-key: ${{ secrets.SEE_CHECKOUT_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: s_e_e_library -> target

      - name: Install static server for smoke checks
        run: sudo apt-get update && sudo apt-get install -y busybox-static

      - id: setup_pages
        uses: actions/configure-pages@v6

      - name: Validate catalog
        run: cargo run -p see_library_catalog_tool -- validate

      - name: Stage GitHub Pages artifact
        run: bash scripts/site-package-pages.sh

      - name: Smoke test staged artifact
        run: bash scripts/site-smoke-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: s_e_e_library/target/pages-artifact
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
