[workspace]
members = ["catalog_tool"]
resolver = "2"

[workspace.package]
license-file = "LICENSE"
publish = false
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.27"
