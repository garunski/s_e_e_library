<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loading">
  <defs>
    <radialGradient id="see-loader-coreGlow" cx="32" cy="32" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="see-loader-blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g stroke="#38bdf8" fill="none">
    <circle cx="32" cy="32" r="14" stroke-width="2"/>
    <path d="M12,32 A20,20 0 0,1 52,32" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M32,52 A20,20 0 0,1 52,32" stroke-width="2" stroke-linecap="round"/>
    <path d="M32,52 A20,20 0 0,0 12,32" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#fbbf24" filter="url(#see-loader-blurGlow)">
    <animate attributeName="r" values="3;5.5;3" dur="1.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="fill-opacity" values="0.85;1;0.85" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="8" fill="url(#see-loader-coreGlow)">
    <animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
